<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Project HQ"><link rel="manifest" href="manifest.webmanifest"><title>Project HQ</title><style>body{margin:0;background:#0b1220;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,Arial;padding:env(safe-area-inset-top) 18px 50px}header{padding:32px 0 12px}h1{font-size:32px;margin:4px 0}small,.muted{color:#a9b7ce}button,input,textarea,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #40506b;background:#17243a;color:white;box-sizing:border-box}button{background:#377cf6;border:0;font-weight:600;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.card{background:#17243a;border:1px solid #283a55;border-radius:20px;padding:18px;margin:12px 0}h2{font-size:19px;margin:0 0 6px}progress{width:100%;height:12px;accent-color:#67a5ff}details{margin-top:14px}summary{cursor:pointer;color:#b6d3ff}label{display:block;margin:12px 0 4px}input,textarea,select{width:100%}textarea{min-height:70px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.danger{background:#5b3042}.task{display:flex;gap:10px;align-items:center;margin:10px 0}.task input{width:auto}.task span{flex:1}.task button{padding:5px 10px}.hidden{display:none}</style></head><body><header><small>YOUR WORKSPACE</small><h1>Project HQ ✦</h1><p class="muted" id="count">9 projects</p></header><nav><button onclick="addProject()">＋ Add project</button><button onclick="exportData()">Export backup</button><button onclick="document.getElementById('import').click()">Import</button><input id="import" class="hidden" type="file" accept="application/json" onchange="importData(event)"></nav><main id="projects"></main><script>const initial=[{"id":1,"name":"YKF Arrivals","description":"Aircraft tracking, ETAs and alerts","status":"In development","progress":0,"tasks":[]},{"id":2,"name":"Crew App","description":"Crew organization and management","status":"In development","progress":0,"tasks":[]},{"id":3,"name":"Logbook","description":"Fitness and nutrition tracking","status":"In development","progress":0,"tasks":[]},{"id":4,"name":"Stack","description":"Personal finance tracker","status":"Blocked","progress":0,"tasks":[]},{"id":5,"name":"Daily Briefing","description":"Automated pre-shift summaries","status":"Planning","progress":0,"tasks":[]},{"id":6,"name":"My Pantry","description":"Pantry and food inventory","status":"Planning","progress":0,"tasks":[]},{"id":7,"name":"Games","description":"Interactive games","status":"Planning","progress":0,"tasks":[]},{"id":8,"name":"Jarvis","description":"Personal AI assistant","status":"Planning","progress":0,"tasks":[]},{"id":9,"name":"Automation Infrastructure","description":"Replace costly bot polling with software and connect development tools","status":"Planning","progress":0,"tasks":[]}];let data;try{data=JSON.parse(localStorage.getItem('projectHQv1'))||initial}catch(e){data=initial}function save(){localStorage.setItem('projectHQv1',JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('count').textContent=data.length+' projects · saved on this device';document.getElementById('projects').innerHTML=data.map((p,i)=>`<article class="card"><div class="row"><div><h2>${esc(p.name)}</h2><small>${esc(p.status)}</small></div><strong>${Number(p.progress)||0}%</strong></div><p class="muted">${esc(p.description)}</p><progress value="${Number(p.progress)||0}" max="100"></progress><details><summary>Edit project & tasks</summary><label>Name</label><input value="${esc(p.name)}" onchange="edit(${i},'name',this.value)"><label>Description</label><textarea onchange="edit(${i},'description',this.value)">${esc(p.description)}</textarea><label>Status</label><select onchange="edit(${i},'status',this.value)">${['Planning','In development','Blocked','Complete'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Progress (%)</label><input type="number" min="0" max="100" value="${p.progress}" onchange="edit(${i},'progress',Math.max(0,Math.min(100,Number(this.value)||0)))"><label>Remaining tasks</label>${p.tasks.map((t,j)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="taskDone(${i},${j},this.checked)"><span>${esc(t.text)}</span><button class="danger" onclick="removeTask(${i},${j})">×</button></div>`).join('')}<div class="row"><input id="task${i}" placeholder="New task"><button onclick="addTask(${i})">Add</button></div><p><button class="danger" onclick="removeProject(${i})">Delete project</button></p></details></article>`).join('')}function edit(i,k,v){data[i][k]=v;save()}function addProject(){let name=prompt('Project name');if(!name||!name.trim())return;data.push({id:Date.now(),name:name.trim(),description:'Add a description',status:'Planning',progress:0,tasks:[]});save()}function removeProject(i){if(confirm('Delete this project?')){data.splice(i,1);save()}}function addTask(i){let el=document.getElementById('task'+i);if(el.value.trim()){data[i].tasks.push({text:el.value.trim(),done:false});save()}}function removeTask(i,j){data[i].tasks.splice(j,1);save()}function taskDone(i,j,v){data[i].tasks[j].done=v;save()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='project-hq-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let v=JSON.parse(t);if(!Array.isArray(v))throw Error('Invalid backup');data=v;save()}).catch(()=>alert('Could not import backup'))}render();</script></body></html>
