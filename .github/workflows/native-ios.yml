name: Native iOS validation
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'monitoring-relay/**'
      - 'integrations/**'
      - 'ci/verify-ios.sh'
      - 'ci/capture-ios-previews.sh'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          HQ_EVENT_ACTION: ${{ github.event.action }}
          HQ_BEFORE_SHA: ${{ github.event.before }}
          HQ_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$HQ_EVENT_ACTION" != "synchronize" || ! "$HQ_BEFORE_SHA" =~ ^[a-fA-F0-9]{40}$ || ! "$HQ_HEAD_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${HQ_BEFORE_SHA}^{commit}" || ! git cat-file -e "${HQ_HEAD_SHA}^{commit}"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$HQ_BEFORE_SHA" "$HQ_HEAD_SHA" > "$RUNNER_TEMP/hq-native-changes.txt"
          if grep -Eq '^(ios/|monitoring-relay/|integrations/|ci/(verify-ios|capture-ios-previews)\.sh$|\.github/workflows/native-ios\.yml$)' "$RUNNER_TEMP/hq-native-changes.txt"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    concurrency:
      group: native-ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test portable Swift core
        run: swift test --package-path ios/HeadQuarter
      - name: Test monitoring relay and optional APNs signing
        run: |
          python3 -m venv "$RUNNER_TEMP/hq-relay-tests"
          "$RUNNER_TEMP/hq-relay-tests/bin/pip" install --disable-pip-version-check -q -r monitoring-relay/requirements-push.txt
          "$RUNNER_TEMP/hq-relay-tests/bin/python" -m unittest discover -s monitoring-relay/tests -v
      - name: Build Watch, iPhone and widgets, then run iOS tests
        run: bash ci/verify-ios.sh
      - name: Capture actual Simulator previews
        timeout-minutes: 3
        continue-on-error: true
        run: bash ci/capture-ios-previews.sh
      - name: Save actual Simulator previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-quarter-simulator-previews
          path: ios/HeadQuarter/DerivedData/previews/*.png
          if-no-files-found: warn
          retention-days: 14
