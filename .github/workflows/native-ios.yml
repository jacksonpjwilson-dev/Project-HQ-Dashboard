name: Native iOS validation
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'ci/verify-ios.sh'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test portable Swift core
        run: swift test --package-path ios/HeadQuarter
      - name: Test monitoring relay
        run: python3 -m unittest discover -s monitoring-relay/tests -v
      - name: Build iPhone app and widgets, then run iOS tests
        run: bash ci/verify-ios.sh
